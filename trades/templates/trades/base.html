<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="TradCal trading journal for recording and reviewing trades.">
  <title>{% block title %}TradCal{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand fw-bold" href="{% url 'home' %}">TradCal</a>
    <div class="d-flex gap-2 align-items-center">
      {% if user.is_authenticated %}
        <span class="text-light small d-none d-sm-inline">{{ user.username }}</span>
        <a class="btn btn-primary btn-sm" href="{% url 'add_trade' %}">Add Trade</a>
        <form method="post" action="{% url 'logout' %}" class="m-0">{% csrf_token %}<button class="btn btn-outline-light btn-sm">Log out</button></form>
      {% else %}
        <a class="btn btn-outline-light btn-sm" href="{% url 'login' %}">Log in</a>
        <a class="btn btn-primary btn-sm" href="{% url 'signup' %}">Sign up</a>
      {% endif %}
    </div>
  </div>
</nav>
<main class="container py-5">
  {% for message in messages %}<div class="alert alert-info" role="alert">{{ message }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
